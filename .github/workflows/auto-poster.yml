name: Instagram Reels Automation

on:
  schedule:
    - cron: '0 * * * *' # Runs every 1 hour to compensate for GitHub queue delays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run automation script
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DEFAULT_CAPTION: ${{ secrets.DEFAULT_CAPTION }}
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: npx ts-node index.ts

      - name: Commit updated posted log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update posted_reels.json [skip ci]"
          file_pattern: "posted_reels.json"